name: astrbot_plugin_dsh_connector
display_name: DeepSeek Harness Connector
short_desc: 连接 DeepSeek Harness，提供按聊天隔离的会话控制与图片输出
desc: >-
  通过 DSH Web Host RPC 在 AstrBot 中创建、绑定和控制 DeepSeek Harness 会话。
  每个聊天窗口独立保存工作空间或目录、Agent Preset、模型、推理强度、权限和 IANA 时区，
  并支持 DSH 原生 attachment 图片、Settings、Skills、Subagents、Goals 与 Workspaces。
version: 2.0.1
author: konodiodaaaaa1
repo: https://github.com/konodiodaaaaa1/astrbot_plugin_dsh_connector
astrbot_version: ">=4.0.0"
support_platforms:
  - qq_official
  - aiocqhttp
tags:
  - deepseek
  - harness
  - dsh
  - connector
